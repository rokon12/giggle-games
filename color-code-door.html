  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

6px)}}\n@keyframes cd-bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}\n@keyframes cd-pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}\n@keyframes cd-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}\n@keyframes cd-spin{to{transform:rotate(360deg)}}\n@keyframes cd-slidein{0%{transform:translateX(calc(-50% + 70vw));opacity:0}100%{transform:translateX(-50%);opacity:1}}\n@keyframes cd-slideout{0%{transform:translateX(-50%);opacity:1}100%{transform:translateX(calc(-50% - 70vw));opacity:0}}\n@keyframes cd-sparkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div sc-camel-on-pointer-down=\"{{ unlock }}\" data-screen-label=\"Color Code Door\" style=\"position:fixed; inset:0; overflow:hidden; font-family:'Baloo 2', ui-rounded, system-ui, sans-serif; color:oklch(0.28 0.06 300); touch-action:manipulation; background:oklch(0.97 0.03 85); display:grid; grid-template-rows:auto minmax(0,1fr) auto;\">\n\n  <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; padding:2vmin 3vmin 0; flex-wrap:wrap;\">\n    <div style=\"display:flex; align-items:center; gap:12px;\"><a href=\".\u002F\" aria-label=\"Back to Giggle Games\" title=\"Back to Giggle Games\" style=\"flex:0 0 48px; width:48px; height:48px; display:grid; place-items:center; text-decoration:none; background:#fff; color:oklch(0.28 0.06 300); border:4px solid oklch(0.28 0.06 300); border-radius:14px; box-shadow:0 4px 0 oklch(0.28 0.06 300); font-size:28px; font-weight:800; line-height:1;\">←<\u002Fa><h1 style=\"margin:0; font-size:clamp(28px,5.5vmin,52px); font-weight:800; line-height:1;\">Color Code Door<\u002Fh1><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:10px;\">\n      <div style=\"padding:6px 14px; background:oklch(0.87 0.17 95); border:4px solid oklch(0.28 0.06 300); border-radius:999px; font-size:clamp(14px,2.4vmin,20px); font-weight:800; white-space:nowrap;\">Door {{ door }}<\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:6px; padding:6px 14px; background:#fff; border:4px solid oklch(0.28 0.06 300); border-radius:999px; font-size:clamp(14px,2.4vmin,20px); font-weight:800; white-space:nowrap;\">\n        <div style=\"width:18px; height:18px; background:oklch(0.87 0.17 95); clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);\"><\u002Fdiv>\n        <span>{{ stars }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative; margin:2vmin 3vmin 0; background:{{ wallCss }}; transition:background 1s; border:5px solid oklch(0.28 0.06 300); border-radius:28px; overflow:hidden; min-height:0; background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 3px, transparent 3px 36px), repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 3px, transparent 3px 70px);\">\n    <div style=\"position:absolute; left:0; right:0; bottom:0; height:12%; background:oklch(0.72 0.1 60); border-top:5px solid oklch(0.28 0.06 300);\"><\u002Fdiv>\n\n    <div style=\"position:absolute; left:50%; bottom:12%; transform:translateX(-50%); width:clamp(150px, min(32vmin, 42vw), 300px); aspect-ratio:0.74; perspective:900px; animation:{{ doorAnim }};\">\n      <div style=\"position:absolute; inset:-10px -10px 0; background:{{ frameCss }}; border:5px solid oklch(0.28 0.06 300); border-bottom:none; border-radius:50% 50% 0 0 \u002F 38% 38% 0 0;\"><\u002Fdiv>\n      <div style=\"position:absolute; inset:0; background:oklch(0.93 0.03 60); border-radius:50% 50% 0 0 \u002F 38% 38% 0 0; overflow:hidden; display:grid; place-items:center;\">\n        <img src=\"3ed651b2-ba23-4346-acab-632c9a58622d\" alt=\"A teddy bear\" style=\"position:absolute; left:50%; top:50%; width:132%; aspect-ratio:1; object-fit:cover; transform:translate(-50%,-50%) scale({{ surpriseScale }}); transition:transform .9s cubic-bezier(.3,1.5,.5,1); display:{{ showTeddy }};\">\n        <img src=\"ea146ccb-fbdd-4172-96d3-da08f8c08135\" alt=\"Balloons\" style=\"position:absolute; left:50%; top:50%; width:132%; aspect-ratio:1; object-fit:cover; transform:translate(-50%,-50%) scale({{ surpriseScale }}); transition:transform .9s cubic-bezier(.3,1.5,.5,1); display:{{ showBalloons }};\">\n        <img src=\"96fc4d64-9d8b-4377-b9c5-c807faebfd2e\" alt=\"A bunny\" style=\"position:absolute; left:50%; top:50%; width:132%; aspect-ratio:1; object-fit:cover; transform:translate(-50%,-50%) scale({{ surpriseScale }}); transition:transform .9s cubic-bezier(.3,1.5,.5,1); display:{{ showBunny }};\">\n        <img src=\"9c7b8ffe-f50c-4071-9f65-80ad1f886bbf\" alt=\"A birthday cake\" style=\"position:absolute; left:50%; top:50%; width:132%; aspect-ratio:1; object-fit:cover; transform:translate(-50%,-50%) scale({{ surpriseScale }}); transition:transform .9s cubic-bezier(.3,1.5,.5,1); display:{{ showCake }};\">\n        <img src=\"6f13aef1-f4bc-4876-aca8-736538c1e55d\" alt=\"A kitten\" style=\"position:absolute; left:50%; top:50%; width:132%; aspect-ratio:1; object-fit:cover; transform:translate(-50%,-50%) scale({{ surpriseScale }}); transition:transform .9s cubic-bezier(.3,1.5,.5,1); display:{{ showKitten }};\">\n        <img src=\"2fa9cbf3-4f60-4a2f-bfe1-78a76100aa09\" alt=\"A rubber duck\" style=\"position:absolute; left:50%; top:50%; width:132%; aspect-ratio:1; object-fit:cover; transform:translate(-50%,-50%) scale({{ surpriseScale }}); transition:transform .9s cubic-bezier(.3,1.5,.5,1); display:{{ showDuck }};\">\n        <sc-for list=\"{{ sparkles }}\" as=\"sp\" hint-placeholder-count=\"0\">\n          <div style=\"position:absolute; left:{{ sp.x }}; top:{{ sp.y }}; width:{{ sp.w }}; aspect-ratio:1; background:#fff; clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); animation:cd-sparkle {{ sp.dur }} ease-in-out infinite; pointer-events:none;\"><\u002F mn; align-items:center;\">\n      <div style=\"position:relative; width:100%; aspect-ratio:0.8; animation:{{ parrotAnim }};\">\n        <div style=\"position:absolute; left:8%; bottom:0; width:16%; height:46%; background:oklch(0.6 0.15 250); border:3px solid oklch(0.28 0.06 300); border-radius:999px; transform:rotate(20deg); transform-origin:50% 0;\"><\u002Fdiv>\n        <div style=\"position:absolute; left:20%; bottom:8%; width:64%; height:62%; background:oklch(0.62 0.21 27); border:4px solid oklch(0.28 0.06 300); border-radius:50% 50% 46% 46% \u002F 46% 46% 54% 54%;\"><\u002Fdiv>\n        <div style=\"position:absolute; left:14%; bottom:26%; width:34%; height:36%; background:oklch(0.68 0.17 145); border:3px solid oklch(0.28 0.06 300); border-radius:60% 40% 70% 30% \u002F 60% 60% 40% 40%; transform:rotate(14deg);\"><\u002Fdiv>\n        <div style=\"position:absolute; left:30%; top:0; width:50%; height:44%; background:oklch(0.62 0.21 27); border:4px solid oklch(0.28 0.06 300); border-radius:50%;\"><\u002Fdiv>\n        <div style=\"position:absolute; left:46%; top:10%; width:16%; height:14%; background:#fff; border:3px solid oklch(0.28 0.06 300); border-radius:50%; display:grid; place-items:center;\"><div style=\"width:45%; height:45%; border-radius:50%; background:oklch(0.28 0.06 300);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:absolute; left:66%; top:20%; width:28%; height:{{ beakH }}; background:oklch(0.85 0.17 70); border:3px solid oklch(0.28 0.06 300); border-radius:10% 90% 70% 50% \u002F 10% 60% 90% 50%; transition:height .1s;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:120%; height:10px; background:oklch(0.5 0.1 55); border:3px solid oklch(0.28 0.06 300); border-radius:999px;\"><\u002Fdiv>\n      <div style=\"width:8px; height:clamp(20px,5vmin,46px); background:oklch(0.5 0.1 55); border:3px solid oklch(0.28 0.06 300); border-top:none;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:absolute; left:calc(4% + clamp(80px, 16vmin, 150px) + 12px); bottom:calc(12% + clamp(60px,12vmin,120px)); padding:8px 16px; background:#fff; border:4px solid oklch(0.28 0.06 300); border-radius:20px; font-size:clamp(16px,3vmin,26px); font-weight:800; white-space:nowrap; animation:cd-pop .3s ease-out;\">{{ bubble }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; flex-direction:column; align-items:center; gap:1.6vmin; padding:2vmin 3vmin 3vmin;\">\n    <div style=\"display:flex; justify-content:center; gap:clamp(10px,2.6vmin,28px); flex-wrap:wrap;\">\n      <sc-for list=\"{{ buttons }}\" as=\"b\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-pointer-down=\"{{ b.tap }}\" style=\"display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;\">\n          <div style=\"width:clamp(56px,12vmin,96px); aspect-ratio:1; border-radius:50%; background:{{ b.css }}; border:5px solid oklch(0.28 0.06 300); box-shadow:0 {{ b.shadow }} 0 oklch(0.28 0.06 300), 0 0 0 {{ b.ring }} rgba(255,255,255,.8); transform:translateY({{ b.y }}); filter:brightness({{ b.bright }}); transition:transform .1s, box-shadow .1s, filter .1s; opacity:{{ b.op }};\"><\u002Fdiv>\n          <div style=\"font-size:clamp(14px,2.4vmin,20px); font-weight:800; line-height:1;\">{{ b.name }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div sc-camel-on-pointer-down=\"{{ again }}\" style=\"padding:8px 20px; background:#fff; border:4px solid oklch(0.28 0.06 300); border-radius:999px; box-shadow:0 5px 0 oklch(0.28 0.06 300); font-size:clamp(15px,2.6vmin,22px); font-weight:800; cursor:pointer; opacity:{{ againOp }}; transition:opacity .3s;\">Sing it again<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;maxLength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:2,&quot;max&quot;:8,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Game&quot;},&quot;slow .92 0.04 300)' },\n  { name:'yellow', door:'oklch(0.88 0.17 95)', frame:'oklch(0.6 0.14 70)', knob:'oklch(0.6 0.2 27)', wall:'oklch(0.9 0.05 230)' },\n  { name:'brown', door:'oklch(0.62 0.11 60)', frame:'oklch(0.42 0.09 55)', knob:'oklch(0.88 0.17 95)', wall:'oklch(0.9 0.06 60)' } ];\nconst byK = k => COLORS.find(c => c.k === k);\n\nclass Component extends DCLogic {\n  state = { door:1, stars:0, code:[], step:0, phase:'intro', lit:null, surprise:SURPRISES[0], bubble:'Hello!', open:false, singing:false, doorAnim:'cd-slidein .9s ease-out both' };\n  timers = []; seq = 0;\n  componentDidMount() { this.later(() => this.startDoor(), 900); }\n  doorStyle(d = this.state.door) { return DOORS[(d - 1) % DOORS.length]; }\n  whoosh() { this.noise(.5, 400, 1800, .16); }\n  componentWillUnmount() { this.timers.forEach(clearTimeout); }\n  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }\n\n  unlock = () => {\n    if (!this.ac) {\n      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;\n      this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = .6;\n      const lp = this.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;\n      this.master.connect(lp); lp.connect(this.ac.destination);\n    }\n    if (this.ac.state === 'suspended') this.ac.resume();\n  };\n  tone(f, f2, dur, type = 'sine', vol = .3, delay = 0) {\n    if (!this.ac || this.props.sound === false) return;\n    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();\n    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);\n    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .05);\n  }\n  noise(dur, from, to, vol = .2) {\n    if (!this.ac || this.props.sound === false) return;\n    const t = this.ac.currentTime, n = Math.floor(this.ac.sampleRate * dur), b = this.ac.createBuffer(1, n, this.ac.sampleRate), d = b.getChannelData(0);\n    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i \u002F n);\n    const s = this.ac.createBufferSource(); s.buffer = b;\n    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.1;\n    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);\n    const g = this.ac.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(this.master); s.start(t);\n  }\n  bleh() { this.tone(300, 170, .4, 'sawtooth', .08); this.tone(150, 95, .4, 'sine', .25); }\n  chime() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, null, .5, 'triangle', .18, i * .09)); }\n  creak() { this.tone(90, 160, .9, 'sawtooth', .05); this.noise(.8, 200, 500, .08); }\n  say(text) {\n    if (this.props.voice === false || !window.speechSynthesis) return;\n    const ss = window.speechSynthesis; ss.cancel();\n    const u = new SpeechSynthesisUtterance(text), vs = ss.getVoices();\n    u.voice = ['Samantha', 'Google UK English Female', 'Karen', 'Moira', 'Tessa', 'Google US English'].map(n => vs.find(v => v.name.includes(n))).find(Boolean) || vs.find(v => \u002F^en\u002Fi.test(v.lang)) || null;\n    u.rate = .92; u.pitch = 1.2; ss.speak(u);\n  }\n\n  lenFor(d) { return Math.min(this.props.maxLength ?? 6, 2 + Math.floor((d - 1) \u002F 2)); }\n  nbFor(d) { return d < 3 ? 4 : d < 6 ? 5 : 6; }\n  startDoor() {\n    const { door } = this.state, len = this.lenFor(door), nb = this.nbFor(door), ds = this.doorStyle(door);\n    const code = Array.from({ length: len }, () => COLORS[Math.floor(Math.random() * nb)].k);\n    const sp = SURPRISES[(door - 1) % SURPRISES.length];\n    this.setState({ code, step: 0, open: false, phase: 'listen', surprise: sp, bubble: `A ${ds.name} door!` });\n    this.say(`Here is a ${ds.name} door!`);\n    this.later(() => this.playSeq(), 1600);\n  }\n  playSeq() {\n    const id = ++this.seq, { code } = this.state, gap = this.props.slow ? 1000 : 780;\n    this.setState({ phase: 'listen', step: 0, bubble: 'Listen!', singing: true });\n    this.say('Listen to the code!');\n    code.forEach((k, i) => this.later(() => { if (id === this.seq) this.light(k, true); }, 1600 + i * gap));\n    this.later(() => { if (id !== this.seq) return; this.setState({ phase: 'repeat', bubble: 'Your turn!', singing: false }); this.say('Your turn!'); }, 1600 + code.length * gap + 200);\n  }\n  light(k, voice) {\n    const c = byK(k); this.setState({ lit: k });\n    this.tone(c.note, null, .45, 'triangle', .3); this.tone(c.note * 2, null, .3, 'sine', .07);\n    if (voice) this.say(c.name);\n    this.later(() => this.setState(s => s.lit === k ? { lit: null } : null), 420);\n  }\n  tap(k) {\n    this.unlock(); const s = this.state; if (s.phase !== 'repeat') return;\n    this.light(k, false);\n    if (k === s.code[s.step]) {\n      const step = s.step + 1; this.setState({ step });\n      if (step === s.code.length) this.later(() => this.openDoor(), 500);\n    } else {\n      this.seq++; this.setState({ phase: 'oops', bubble: 'Oops!' }); this.bleh(); this.say('Oops! Listen again.');\n      this.later(() => this.playSeq(), 1700);\n    }\n  }\n  openDoor() {\n    const { door } = this.state, sp = SURPRISES[(door - 1) % SURPRISES.length];\n    this.setState(s => ({ phase: 'open', open: true, surprise: sp, bubble: 'Hooray!', stars: s.stars + 1 }));\n    this.creak(); this.later(() => this.chime(), 700);\n    this.later(() => this.say(`You opened the door! Look, ${sp.say}!`), 400);\n    this.later(() => {\n      this.setState({ open: false, bubble: 'Next door!' }); this.creak();\n      this.later(() => {\n        this.setState({ doorAnim: 'cd-slideout .7s ease-in both' }); this.whoosh();\n        this.later(() => { this.setState(s => ({ door: s.door + 1, doorAnim: 'cd-slidein .9s ease-out both' })); this.whoosh(); this.startDoor(); }, 750);\n      }, 1200);\n    }, 5000);\n  }\n  again = () => { this.unlock(); if (this.state.phase !== 'repeat') return; this.seq++; this.playSeq(); };\n\n  renderVals() {\n    const { door, stars, code, step, phase, lit, surprise, bubble, open, singing, doorAnim } = this.state;\n    const nb = this.nbFor(door), ds = this.doorStyle(door);\n    return {\n      unlock: this.unlock, door, stars, bubble, open, doorAnim,\n      wallCss: ds.wall, frameCss: ds.frame, doorCss: ds.door, knobCss: ds.knob,\n      leftRot: open ? '-112deg' : '0deg', rightRot: open ? '112deg' : '0deg',\n      surpriseScale: open ? 1 : .7,\n      showTeddy: surprise.k === 'teddy' ? 'block' : 'none', showBalloons: surprise.k === 'balloons' ? 'block' : 'none', showBunny: surprise.k === 'bunny' ? 'block' : 'none',\n      showCake: surprise.k === 'cake' ? 'block' : 'none', showKitten: surprise.k === 'kitten' ? 'block' : 'none', showDuck: surprise.k === 'duck' ? 'block' : 'none',\n      sparkles: open ? [[8, 12, 14, '1.3s'], [84, 18, 12, '1.7s'], [14, 72, 10, '1.1s'], [88, 66, 15, '1.5s'], [50, 6, 11, '1.9s']].map(([x, y, w, dur]) => ({ x: x + '%', y: y + '%', w: w + 'px', dur })) : [],\n      parrotAnim: singing ? 'cd-bounce .4s ease-in-out infinite' : 'cd-bob 2.4s ease-in-out infinite',\n      beakH: lit && singing ? '30%' : '18%',\n      dots: code.map((k, i) => ({ css: i < step ? byK(k).css : 'transparent', border: i < step ? 'solid' : 'dashed' })),\n      buttons: COLORS.slice(0, nb).map(c => ({ css: c.css, name: c.name, tap: () => this.tap(c.k),\n        shadow: lit === c.k ? '0px' : '7px', y: lit === c.k ? '7px' : '0px', bright: lit === c.k ? 1.25 : 1, ring: lit === c.k ? '6px' : '0px',\n        op: phase === 'repeat' || lit === c.k ? 1 : .75 })),\n      again: this.again, againOp: phase === 'repeat' ? 1 : .35,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
